spring.application.name=treino-casa-do-codigo

#spring.datasource.url=jdbc:h2:mem:casaDoCodigodb
spring.datasource.url=jdbc:h2:file:./data/casaDoCodigodb AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
